name: Changeset

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Check Changeset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check Changeset
        if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
        run: yarn changeset status --since=origin/${{ github.base_ref }}
