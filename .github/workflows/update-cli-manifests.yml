name: Update CLI Manifests

on:
  schedule:
    # 13:00 KST
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-cli-manifests
  cancel-in-progress: false

jobs:
  update:
    name: Update CLI manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Update manifests
        id: update
        shell: bash
        run: |
          set +e
          yarn manifests:update > "$RUNNER_TEMP/manifest-update.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/manifest-update.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open failure pull request
        if: steps.update.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="automation/update-cli-manifests"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit --allow-empty -m "report cli manifest update failure"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"

          body_file="$(mktemp)"
          {
            printf '%s\n' \
              "Automated CLI manifest update failed before generated manifests could be refreshed." \
              "" \
              "Fix the adapter policy or manifest generation logic on this branch, then run:" \
              "" \
              '```sh' \
              "yarn manifests:update" \
              "yarn manifests:check" \
              '```' \
              "" \
              "Failure output:" \
              "" \
              '```text'
            tail -n 160 "$RUNNER_TEMP/manifest-update.log"
            printf '%s\n' '```'
          } > "$body_file"

          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --title "Fix CLI manifest update failure" \
              --body-file "$body_file"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Fix CLI manifest update failure" \
              --body-file "$body_file"
          fi

          exit 1

      - name: Detect changes
        if: steps.update.outputs.status == '0'
        id: diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add changeset
        if: steps.update.outputs.status == '0' && steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          changeset=".changeset/cli-manifest-update-$(date -u +%Y%m%d%H%M%S).md"
          printf '%s\n' \
            '---' \
            '"toolchains-init": patch' \
            '---' \
            '' \
            'Update generated CLI command manifests from upstream package metadata.' \
            > "$changeset"

      - name: Validate generated manifests
        if: steps.update.outputs.status == '0' && steps.diff.outputs.changed == 'true'
        run: yarn manifests:check

      - name: Open pull request
        if: steps.update.outputs.status == '0' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="automation/update-cli-manifests"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          yarn format
          body_file="$(mktemp)"
          yarn tsx scripts/render-cli-manifest-pr-body.ts > "$body_file"
          git add .changeset src/stacks
          git commit -m "update cli command manifests"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"

          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --title "Update CLI command manifests" \
              --body-file "$body_file"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update CLI command manifests" \
              --body-file "$body_file"
          fi
